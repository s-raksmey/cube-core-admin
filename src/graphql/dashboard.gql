query PlatformDashboard {
  platformDashboard {
    totalSubTenants
    activeSubTenants
    totalAdmins
    platformHealth
    growthByMonth {
      month
      count
    }
    statusDistribution {
      status
      count
    }
    recentSubTenants {
      id
      name
      slug
      status
      createdAt
    }
    recentActivity {
      id
      action
      createdAt
      actorEmail
      targetTenantName
      targetTenantSlug
    }
  }
}

query TenantDashboard {
  tenantDashboard {
    tenant {
      id
      name
      slug
      status
    }
    totalUsers
    activeUsers
    publishedContent
    mediaStorageBytes
    contentActivityByMonth {
      month
      count
    }
    contentByStatus {
      status
      count
    }
    recentUsers {
      id
      email
      fullName
      role
      status
    }
    recentActivity {
      id
      action
      createdAt
      actorEmail
      targetTenantName
      targetTenantSlug
    }
  }
}
