query ValidateActivationToken($token: String!) {
  validateActivationToken(token: $token) {
    valid
    expiresAt
    email
    firstName
    lastName
    needsActivation
  }
}

mutation CompleteActivation(
  $token: String!
  $username: String!
  $password: String!
  $confirmPassword: String!
) {
  completeActivation(
    token: $token
    username: $username
    password: $password
    confirmPassword: $confirmPassword
  ) {
    nextStep
    challengeToken
    qrCodeDataUrl
    manualEntryKey
    email
    username
  }
}

mutation CompleteActivationTotp(
  $challengeToken: String!
  $code: String!
) {
  completeActivationTotp(
    challengeToken: $challengeToken
    code: $code
  ) {
    success
    recoveryCodes
    user {
      id
      email
    }
  }
}
