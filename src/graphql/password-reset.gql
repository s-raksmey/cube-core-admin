query ValidatePasswordResetToken($token: String!) {
  validatePasswordResetToken(token: $token) {
    valid
    expiresAt
    username
  }
}

mutation CompletePasswordReset(
  $token: String!
  $password: String!
  $confirmPassword: String!
) {
  completePasswordReset(
    token: $token
    password: $password
    confirmPassword: $confirmPassword
  ) {
    success
  }
}
