query ValidatePasswordResetToken($token: String!) {
  validatePasswordResetToken(token: $token) {
    valid
    expiresAt
  }
}

mutation CompletePasswordReset(
  $token: String!
  $firstName: String
  $lastName: String
  $fullName: String
  $password: String!
  $confirmPassword: String!
) {
  completePasswordReset(
    token: $token
    firstName: $firstName
    lastName: $lastName
    fullName: $fullName
    password: $password
    confirmPassword: $confirmPassword
  ) {
    success
  }
}
